<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>NGC - Cadastro</title>
    <link rel="stylesheet" href="css/auth.css">
    <link rel="icon" href="assets/icon.png" type="image/png">

</head>

<body>
    <div class="container">
        <div class="card">
            <img class="img-logo" src="assets/ngc-logo.png" alt="NGC">
            <h2>Criar conta</h2>
            <form id="registerForm"><label for="name">Nome</label><input id="name" type="text" maxlength="100" required autocomplete="name"><label for="email">E-mail</label><input id="email" type="email" maxlength="190" required autocomplete="email"><label for="password">Senha</label><input id="password" type="password" minlength="8" required autocomplete="new-password"><button type="submit">Cadastrar</button></form>
            <div id="message" class="message"></div>
            <p>Já possui conta? <a href="login.html">Entrar</a></p>
        </div>
    </div>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {

            e.preventDefault();

            const message = document.getElementById('message');

            const nameInput = document.getElementById('name');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');

            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            message.textContent = 'Criando conta...';

            try {

                const response = await fetch('backend/auth/register.php', {
                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    credentials: 'same-origin',

                    body: JSON.stringify({
                        name: name,
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (data.success) {

                    message.textContent =
                        'Conta criada com sucesso! Redirecionando...';

                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1000);

                    return;
                }

                message.textContent =
                    data.message || 'Não foi possível criar a conta.';

            } catch (error) {

                console.error(error);

                message.textContent =
                    'Erro de comunicação com o servidor.';
            }
        });
    </script>
</body>

</html>
