<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>
/** APP() inline — não depende de arquivo externo */
(function () {
  function detect() {
    if (typeof window.APP_BASE === 'string' && window.APP_BASE !== '') {
      return String(window.APP_BASE).replace(/\/$/, '');
    }
    var p = location.pathname || '';
    var entries = ['/login.html', '/register.html', '/index.html'];
    for (var i = 0; i < entries.length; i++) {
      var e = entries[i];
      if (p.length >= e.length && p.slice(-e.length) === e) {
        var b = p.slice(0, -e.length);
        return b === '/' ? '' : b;
      }
    }
    var idxNes = p.indexOf('/sistemas/nes/');
    if (idxNes >= 0) return p.slice(0, idxNes);
    var idxA = p.indexOf('/sistemas/a2600/');
    if (idxA >= 0) return p.slice(0, idxA);
    var idxNesRoot = p.indexOf('/sistemas/nes');
    if (idxNesRoot >= 0) return p.slice(0, idxNesRoot);
    var idxARoot = p.indexOf('/sistemas/a2600');
    if (idxARoot >= 0) return p.slice(0, idxARoot);
    var idxMdRoot = p.indexOf('/sistemas/megadrive');
    if (idxMdRoot >= 0) return p.slice(0, idxMdRoot);
    if (p === '/' || p === '') return '';
    if (p.slice(-1) === '/') {
      var d = p.slice(0, -1);
      return d === '' ? '' : d;
    }
    return '';
  }
  window.APP_BASE = detect();
  window.APP = function (path) {
    var b = String(window.APP_BASE || '').replace(/\/$/, '');
    var x = String(path || '');
    if (!x) return b || '/';
    if (/^https?:\/\//i.test(x)) return x;
    if (x.charAt(0) !== '/') x = '/' + x;
    return b + x;
  };
})();
</script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RetroCompiler</title>
  <script>
    document.write('<link rel="icon" href="' + APP('/sistemas/nes/assets/icon.png') + '" type="image/png">');
    document.write('<link rel="stylesheet" href="' + APP('/sistemas/nes/css/auth.css') + '">');
  </script>
  <style>
    body { background:#0d0f14; color:#ccc; font-family: system-ui, sans-serif; margin:0; min-height:100vh; }
    .hub { max-width: 920px; margin: 0 auto; padding: 40px 20px; display:none; }
    .hub-head { display:flex; align-items:center; gap:16px; margin-bottom:32px; flex-wrap:wrap; }
    .hub-head img { height: 56px; }
    .hub-head h1 { margin:0; font-size:22px; color:#fff; }
    .hub-head p { margin:4px 0 0; font-size:13px; color:#888; }
    .hub-actions { margin-left:auto; display:flex; gap:8px; }
    .btn { display:inline-block; padding:8px 14px; border-radius:6px; border:1px solid #333; background:#1a1e28; color:#ddd; text-decoration:none; font-size:13px; cursor:pointer; }
    .btn:hover { border-color:#4ec9b0; color:#fff; }
    .btn-primary { background:#1a3a32; border-color:#2a6a55; color:#7dcea0; }
    .systems { display:grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap:16px; margin-bottom:36px; }
    .sys-card { position:relative; overflow:hidden; background:linear-gradient(180deg,#1a1f2b,#12151c); background-size:cover; background-position:center; border:1px solid #333; border-radius:12px; padding:18px; min-height:150px; }
    .sys-card::before { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(13,15,20,.72),rgba(13,15,20,.94)); pointer-events:none; }
    .sys-card > * { position:relative; z-index:1; }
    .sys-card h2 { margin:0 0 6px; font-size:16px; color:#ffcc00; }
    .sys-card p { margin:0 0 14px; font-size:12px; color:#aaa; line-height:1.45; min-height:36px; }
    .badge { display:inline-block; font-size:10px; padding:2px 8px; border-radius:999px; background:#243; color:#7dcea0; border:1px solid #2a5a4a; }
    .badge.off { background:#2a2a2a; color:#777; border-color:#444; }
    .user-line { font-size:12px; color:#666; margin-bottom:20px; }
    .user-line b { color:#4ec9b0; }
    .boot { padding:40px 20px; text-align:center; color:#666; font-size:13px; }
  </style>
</head>
<body>
  <div class="boot" id="bootMsg">Verificando sessão…</div>
  <div class="hub" id="hub">
    <div class="hub-head">
      <img id="hubLogo" alt="RetroCompiler">
      <div>
        <h1>RetroCompiler</h1>
        <p>Escolha o sistema para abrir seus projetos.</p>
      </div>
      <div class="hub-actions" id="hubActions">
        <button type="button" class="btn" id="btnLogout">Sair</button>
      </div>
    </div>
    <div class="user-line" id="userLine"></div>
    <div class="systems" id="systems"></div>
  </div>
  <script>
    (async () => {
      const boot = document.getElementById('bootMsg');
      const hub = document.getElementById('hub');
      const userLine = document.getElementById('userLine');
      const systems = document.getElementById('systems');

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function renderSystems(config) {
        systems.innerHTML = '';
        const systemList = config && config.system ? config.system : {};

        Object.keys(systemList).forEach((systemId) => {
          const system = systemList[systemId] || {};
          if (system.visivel === false) return;

          const card = document.createElement('div');
          card.className = 'sys-card';

          if (system.background) {
            card.style.backgroundImage = 'url("' + APP(system.background) + '")';
          }

          const available = system.disponivel === true;
          const label = system.label || systemId;
          const about = system.sobre || '';

          card.innerHTML =
            '<span class="badge' + (available ? '' : ' off') + '">' +
              (available ? 'disponível' : 'em desenvolvimento') +
            '</span>' +
            '<h2>' + escapeHtml(label) + '</h2>' +
            '<p>' + escapeHtml(about) + '</p>';

          if (available && system.dashboard) {
            const link = document.createElement('a');
            link.className = 'btn btn-primary';
            link.href = APP(system.dashboard);
            link.textContent = 'Abrir dashboard';
            card.appendChild(link);
          }

          systems.appendChild(card);
        });
      }

      async function loadHubConfig() {
        const r = await fetch(APP('/data/config/hub.json'), {
          credentials: 'same-origin',
          cache: 'no-store'
        });
        if (!r.ok) throw new Error('Não foi possível carregar data/config/hub.json');
        return await r.json();
      }

      try {
        const r = await fetch(APP('/backend/auth/session.php'), { credentials: 'same-origin' });
        const j = await r.json().catch(() => ({}));
        if (!j || !j.authenticated) {
          window.location.replace(APP('/login.html'));
          return;
        }

        const config = await loadHubConfig();
        renderSystems(config);

        // O logo do Hub continua sendo o logo geral do sistema NES por enquanto.
        document.getElementById('hubLogo').src = APP('/sistemas/nes/assets/ngc-logo.png');

        boot.style.display = 'none';
        hub.style.display = 'block';
        userLine.innerHTML = 'Logado como <b>' + escapeHtml(j.user?.name || j.user?.email || 'usuário') + '</b>';

        document.getElementById('btnLogout').onclick = async () => {
          await fetch(APP('/backend/auth/logout.php'), { method: 'POST', credentials: 'same-origin' });
          window.location.replace(APP('/login.html'));
        };
      } catch (e) {
        console.error('Erro ao inicializar o Hub:', e);
        window.location.replace(APP('/login.html'));
      }
    })();
  </script>
</body>
</html>
